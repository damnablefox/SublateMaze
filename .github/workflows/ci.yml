name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建原生模块
        run: pnpm build:native

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范检查
        run: pnpm lint

      - name: 单元与契约测试
        run: pnpm test

      - name: Rust 测试
        run: cargo test

      - name: 构建 Electron 应用
        run: pnpm --filter @sublate/desktop build

      - name: 加载内核 profile
        run: pnpm dev:kernel
